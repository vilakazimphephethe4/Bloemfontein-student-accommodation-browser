<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My-Student-SA Gallery</title>
    <meta
      name="description"
      content="Photo gallery of the My-Student-SA: rooms, study room, laundry, braai area and more." />
    <meta name="theme-color" content="#004aad" />

    <script>
      document.documentElement.classList.add("js");
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <header class="header-simple">
      <a class="logo" href="index.html">My Student SA Accommodation</a>
      <nav aria-label="Main navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="index.html#accommodations">Accommodations</a></li>
          <li>
            <a class="nav-cta" href="booking.html?property=StudentSA"
              >Book Now</a
            >
          </li>
        </ul>
      </nav>
    </header>

    <main id="main">
      <div class="page-hero">
        <h1>My Student SA Gallery</h1>
        <p>Tap any photo to view it full size.</p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="booking.html?property=StudentSA"
            >Book My Student SA</a
          >
        </div>
      </div>

      <a class="back-link" href="index.html#accommodations"
        >Back to Accommodations</a
      >

      <div class="gallery">
        <button class="gallery-item" type="button">
          <img
            class="gal-images"
            src="Willows-images/property_view.jpg"
            alt="Property-View"
            width="600"
            height="400"
            loading="lazy" />
        </button>
        <button class="gallery-item" type="button">
          <img
            class="gal-images"
            src="Willows-images/room.jpg"
            alt="room"
            width="600"
            height="400"
            loading="lazy" />
        </button>
        <button class="gallery-item" type="button">
          <img
            class="gal-images"
            src="Willows-images/view1.jpg"
            alt="View 1"
            width="600"
            height="400"
            loading="lazy" />
        </button>
        <button class="gallery-item" type="button">
          <img
            class="gal-images"
            src="Willows-images/view2.jpg"
            alt="View 2"
            width="600"
            height="400"
            loading="lazy" />
        </button>
        <button class="gallery-item" type="button">
          <img
            class="gal-images"
            src="Willows-images/view3.jpg"
            alt="View 3"
            width="600"
            height="400"
            loading="lazy" />
        </button>
        <button class="gallery-item" type="button">
          <img
            class="gal-images"
            src="Willows-images/computer_lab.jpg"
            alt="Computer Lab"
            width="600"
            height="400"
            loading="lazy" />
        </button>
        <button class="gallery-item" type="button">
          <img
            class="gal-images"
            src="Willows-images/e_room.jpg"
            alt="Entertainment room"
            width="600"
            height="400"
            loading="lazy" />
        </button>
        <button class="gallery-item" type="button">
          <img
            class="gal-images"
            src="Willows-images/braai_area.jpg"
            alt="Braai area"
            width="600"
            height="400"
            loading="lazy" />
        </button>
        <button class="gallery-item" type="button">
          <img
            class="gal-images"
            src="Willows-images/laundry.jpg"
            alt="Laundry room"
            width="600"
            height="400"
            loading="lazy" />
        </button>
      </div>
    </main>

    <!-- Lightbox -->
    <div
      id="lightbox"
      class="lightbox"
      role="dialog"
      aria-modal="true"
      aria-label="Image viewer">
      <button class="lb-btn lb-close" type="button" aria-label="Close">
        &times;
      </button>
      <button class="lb-btn lb-prev" type="button" aria-label="Previous photo">
        &#10094;
      </button>
      <button class="lb-btn lb-next" type="button" aria-label="Next photo">
        &#10095;
      </button>
      <img class="lightbox-content" id="lightbox-img" alt="" />
      <div id="caption" class="caption" aria-live="polite"></div>
    </div>

    <footer>
      <p>
        &copy; <span data-year>2026</span> Student Accommodation Browsing.
        Portfolio project.
      </p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
