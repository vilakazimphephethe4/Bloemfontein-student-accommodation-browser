<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Your Accommodation</title>
    <meta
      name="description"
      content="Send a booking request for Rhule student accommodation in Bloemfontein." />
    <meta name="theme-color" content="#004aad" />

    <script>
      document.documentElement.classList.add("js");
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <header class="header-simple">
      <a class="logo" href="index.html">Student Accommodation Browsing</a>
      <nav aria-label="Main navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="index.html#properties">Accommodations</a></li>
          <li><a href="index.html#contact">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main id="main">
      <div class="page-hero">
        <h1>Book Your Accommodation</h1>
        <p>Fill in the form and we'll get back to you as soon as possible.</p>
      </div>

      <section class="booking" id="booking">
        <div class="booking-form">
          <form action="https://formspree.io/f/xgvpadva" method="POST">
            <div class="form-field">
              <label for="name">Full Name</label>
              <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                autocomplete="name"
                required />
            </div>

            <div class="form-field">
              <label for="email">Email Address</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required />
            </div>

            <div class="form-field">
              <label for="phone">Phone Number</label>
              <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
                autocomplete="tel"
                required />
            </div>

            <div class="form-field">
              <label for="property">Select Accommodation</label>
              <select id="property" name="Accommodation" required>
                <option value="">-- Choose a Property --</option>
                <option value="Rhule">Rhule Accommodation</option>
                <option value="StudentSA">My-Student-SA</option>
                <option value="Bloemfontein-central">
                  Bloemfontein Central
                </option>
              </select>
            </div>

            <div class="form-row">
              <div class="form-field">
                <label for="movein">Move-In Date</label>
                <input type="date" id="movein" name="movein" required />
              </div>

              <div class="form-field">
                <label for="duration">Lease Duration</label>
                <select id="duration" name="duration" required>
                  <option value="">-- Select Duration --</option>
                  <option value="3-months">3 Months</option>
                  <option value="6-months">6 Months</option>
                  <option value="10-months">10 Months</option>
                </select>
              </div>
            </div>

            <div class="form-field">
              <label for="message">Additional Message</label>
              <textarea
                id="message"
                name="message"
                rows="4"
                placeholder="Any specific requests or questions?"></textarea>
            </div>

            <!-- Spam trap: real visitors never see or fill this in -->
            <div class="visually-hidden" aria-hidden="true">
              <label for="website">Leave this field empty</label>
              <input
                type="text"
                id="website"
                name="_gotcha"
                tabindex="-1"
                autocomplete="off" />
            </div>

            <button type="submit">Submit Booking Request</button>
          </form>
        </div>
      </section>
    </main>

    <button id="backToTop" type="button" aria-label="Back to top">↑</button>
    <footer>
      <p>
        &copy; <span data-year>2026</span> Student Accommodation Browsing.
        Portfolio project.
      </p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
